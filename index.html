              'on-error-container': '#ffdad6',
              'secondary-fixed-dim': '#d0bcff',
              primary: '#e1fdff',
              'secondary-fixed': '#e9ddff',
              'on-surface': '#dce4e4',
              'surface-bright': '#333b3b',
              'secondary-container': '#571bc1',
              'on-tertiary-fixed-variant': '#653e00',
              'error-container': '#93000a',
              'tertiary-fixed-dim': '#ffb95f',
              'surface-tint': '#00dbe7',
              'inverse-primary': '#00696f',
              'inverse-on-surface': '#2a3232',
              outline: '#849495',
              'on-primary': '#00363a',
              'on-primary-fixed-variant': '#004f54',
              'surface-container-low': '#151d1e',
              'on-secondary': '#3c0091',
              'surface-container-lowest': '#080f10',
              'on-tertiary-fixed': '#2a1700',
              'on-tertiary-container': '#875500',
              'on-secondary-container': '#c4abff',
              'on-secondary-fixed': '#23005c',
              'on-tertiary': '#472a00',
              background: '#0d1515',

              'inverse-surface': '#dce4e4',

              'on-primary-fixed': '#002022',
              'on-secondary-fixed-variant': '#5516be',
              'surface-container-high': '#232b2c',
              'primary-fixed-dim': '#00dbe7',
              'on-error': '#690005',
              'on-surface-variant': '#b9cacb',
              tertiary: '#fff6f0',

              'tertiary-fixed': '#ffddb8',
            },
            borderRadius: {

    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
      }

      body {
        background-color: #070b12;
        color: #dce4e4;
      }
      button {
        background-color: transparent;
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
      .graph-line {
        background: linear-gradient(90deg, rgba(0, 219, 231, 0.2) 0%, rgba(208, 188, 255, 0.2) 100%);
      }
      .glow-cyan {
        box-shadow: 0 0 15px rgba(0, 219, 231, 0.15);
      }
      .scan-effect {
        position: relative;
        overflow: hidden;
      }
      .scan-effect::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 219, 231, 0.4), transparent);
        animation: scan 2s infinite linear;
      }
      @keyframes scan {
        100% {
          left: 150%;
        }
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .pulse-error {
        animation: pulse-dot 2s infinite;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(58, 73, 75, 0.85) rgba(8, 15, 16, 0.6);
      }
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-track {
        background: rgba(8, 15, 16, 0.6);
      }
      *::-webkit-scrollbar-thumb {
        background-color: rgba(58, 73, 75, 0.85);
        border-radius: 9999px;
        border: 2px solid rgba(8, 15, 16, 0.6);
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: rgba(0, 219, 231, 0.35);
      }
      *::-webkit-scrollbar-corner {
        background: rgba(8, 15, 16, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
